<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级灵敏度实验室｜Valorant</title>
    <style>
        body {
            background-color: #0f1419;
            color: #eee;
            font-family: system-ui;
            max-width: 620px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: #1f242b;
            padding: 22px;
            border-radius: 12px;
            margin:14px 0;
        }
        input {
            width:100%;
            padding:11px;
            margin:9px 0;
            background:#2c333b;
            border:none;
            color:#fff;
            border-radius:7px;
            font-size:16px;
        }
        button {
            width:100%;
            padding:13px;
            background:#ff4655;
            border:none;
            color:#fff;
            border-radius:8px;
            font-size:16px;
        }
        #resultBox {
            color:#88eeff;
            margin-top:12px;
        }
    </style>
</head>
<body>
    <h1>无畏契约｜高级灵敏度换算</h1>
    <div class="card">
        <label>CS2 灵敏度</label>
        <input id="cs2" placeholder="输入CS2灵敏度">
        <label>鼠标DPI</label>
        <input id="dpi" placeholder="DPI数值">
        <label>转换目标游戏</label>
        <input id="game" value="Valorant" readonly>
        <button onclick="runCalc()">开始换算</button>
        <div id="resultBox"></div>
    </div>

<script>
function runCalc(){
    let csVal = parseFloat(document.getElementById('cs2').value);
    let dpiVal = parseFloat(document.getElementById('dpi').value);
    let out = csVal * 0.022;
    document.getElementById('resultBox').innerText = `换算结果：${out.toFixed(3)}`;
}
</script>
</body>
</html>
